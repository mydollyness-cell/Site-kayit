<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Kayit Sistemi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Site Kayit Sistemi</h1>
    <p class="subtitle">Daire sakinleri kayit formu</p>
  </header>
  <nav class="menu">
    <button class="menu-btn active" data-page="register">Kayit</button>
    <button class="menu-btn" data-page="list">Kayitlar</button>
  </nav>
  <section id="page-register" class="page active">
    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="block">Blok Secimi</label>
        <select id="block" required>
          <option value="">-- Blok Seciniz --</option>
          <option value="A">A Blok</option>
          <option value="B">B Blok</option>
          <option value="C">C Blok</option>
          <option value="D">D Blok</option>
          <option value="E">E Blok</option>
          <option value="F">F Blok</option>
          <option value="G">G Blok</option>
        </select>
      </div>
      <div class="form-group">
        <label for="apartmentNo">Daire Numarasi</label>
        <input type="number" id="apartmentNo" placeholder="Orn: 12" min="1" required>
      </div>
      <div class="form-group">
        <label for="residentType">Oturum Sekli</label>
        <select id="residentType" required>
          <option value="">-- Seciniz --</option>
          <option value="Ev Sahibi">Ev Sahibi</option>
          <option value="Kiraci">Kiraci</option>
        </select>
      </div>
      <div class="form-group">
        <label for="nameSurname">Ad Soyad</label>
        <input type="text" id="nameSurname" placeholder="Adiniz ve Soyadiniz" required>
      </div>
      <button type="submit" id="submitBtn">
        <span class="btn-text">Kayit Ol</span>
        <span class="btn-loading hidden">Kaydediliyor...</span>
      </button>
    </form>
    <div id="message" class="message hidden"></div>
  </section>
  <section id="page-list" class="page">
    <div class="list-header">
      <div class="list-filter">
        <label for="filterBlock">Blok Filtrele:</label>
        <select id="filterBlock">
          <option value="">Tumu</option>
          <option value="A">A Blok</option>
          <option value="B">B Blok</option>
          <option value="C">C Blok</option>
          <option value="D">D Blok</option>
          <option value="E">E Blok</option>
          <option value="F">F Blok</option>
          <option value="G">G Blok</option>
        </select>
      </div>
      <button type="button" id="exportBtn" class="export-btn">Excel Aktar</button>
      <p class="total-count">Toplam: <span id="totalCount">0</span> kayit</p>
    </div>
    <div id="registrationsList" class="registrations-list">
      <p class="loading-text">Yukleniyor...</p>
    </div>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
